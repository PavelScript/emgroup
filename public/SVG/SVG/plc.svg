<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Основной корпус ПЛК -->
  <rect x="10" y="10" width="80" height="60" rx="3" fill="none" stroke="#2c3e50" stroke-width="2.5"/>
  
  <!-- Верхняя секция (диагностические светодиоды) -->
  <line x1="10" y1="28" x2="90" y2="28" stroke="#2c3e50" stroke-width="1.5"/>
  <circle cx="18" cy="19" r="2" fill="#27ae60"/> <!-- Светодиод питания (зеленый) -->
  <circle cx="28" cy="19" r="2" fill="#e74c3c"/> <!-- Светодиод ошибки (красный) -->
  <circle cx="38" cy="19" r="2" fill="#f1c40f"/> <!-- Светодиод работы (желтый) -->
  <line x1="65" y1="14" x2="85" y2="14" stroke="#7f8c8d" stroke-width="1"/>
  <line x1="65" y1="19" x2="85" y2="19" stroke="#7f8c8d" stroke-width="1"/>
  <line x1="65" y1="24" x2="85" y2="24" stroke="#7f8c8d" stroke-width="1"/>
  
  <!-- Нижняя секция (клеммная колодка) -->
  <rect x="10" y="70" width="80" height="20" rx="3" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Разделители клемм -->
  <line x1="26" y1="70" x2="26" y2="90" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="42" y1="70" x2="42" y2="90" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="58" y1="70" x2="58" y2="90" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="74" y1="70" x2="74" y2="90" stroke="#7f8c8d" stroke-width="1.5"/>
  
  <!-- Винты клемм -->
  <circle cx="18" cy="80" r="3" fill="none" stroke="#2c3e50" stroke-width="1.5"/>
  <line x1="16" y1="78" x2="20" y2="82" stroke="#2c3e50" stroke-width="1"/>
  <line x1="20" y1="78" x2="16" y2="82" stroke="#2c3e50" stroke-width="1"/>
  
  <circle cx="34" cy="80" r="3" fill="none" stroke="#2c3e50" stroke-width="1.5"/>
  <line x1="32" y1="78" x2="36" y2="82" stroke="#2c3e50" stroke-width="1"/>
  <line x1="36" y1="78" x2="32" y2="82" stroke="#2c3e50" stroke-width="1"/>
  
  <circle cx="50" cy="80" r="3" fill="none" stroke="#2c3e50" stroke-width="1.5"/>
  <line x1="48" y1="78" x2="52" y2="82" stroke="#2c3e50" stroke-width="1"/>
  <line x1="52" y1="78" x2="48" y2="82" stroke="#2c3e50" stroke-width="1"/>
  
  <circle cx="66" cy="80" r="3" fill="none" stroke="#2c3e50" stroke-width="1.5"/>
  <line x1="64" y1="78" x2="68" y2="82" stroke="#2c3e50" stroke-width="1"/>
  <line x1="68" y1="78" x2="64" y2="82" stroke="#2c3e50" stroke-width="1"/>
  
  <circle cx="82" cy="80" r="3" fill="none" stroke="#2c3e50" stroke-width="1.5"/>
  <line x1="80" y1="78" x2="84" y2="82" stroke="#2c3e50" stroke-width="1"/>
  <line x1="84" y1="78" x2="80" y2="82" stroke="#2c3e50" stroke-width="1"/>
  
  <!-- Детали портов/слотов на корпусе -->
  <rect x="18" y="38" width="10" height="25" fill="#e7e7e7"/>
  <rect x="33" y="38" width="10" height="25" fill="#e7e7e7"/>
  <rect x="48" y="38" width="25" height="25" rx="1.5" fill="#e7e7e7"/>
  <line x1="53" y1="43" x2="68" y2="43" stroke="#2c3e50" stroke-width="1.5"/>
  <line x1="53" y1="48" x2="68" y2="48" stroke="#2c3e50" stroke-width="1"/>
  <line x1="53" y1="53" x2="68" y2="53" stroke="#2c3e50" stroke-width="1"/>
  <line x1="53" y1="58" x2="68" y2="58" stroke="#2c3e50" stroke-width="1"/>

</svg>